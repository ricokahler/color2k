name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once and never cancel one in progress; a newer run
# waits for the current one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pending:
    name: Check for a pending release
    # Manual runs skip this gate and go straight to the release job.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.dry-run.outputs.release }}
    steps:
      - name: Checkout
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # semantic-release dry run with only the commit analyzer (and the
      # .releaserc.json release rules). Before analyzing, semantic-release runs
      # `git push --dry-run` to check push access, which this read-only job
      # can't pass, so it is pointed at a local bare mirror of this
      # full-history checkout. Any semantic-release error fails the job.
      - name: Dry-run semantic-release
        id: dry-run
        run: |
          git clone --quiet --bare . "$RUNNER_TEMP/mirror.git"
          RELEASE_MIRROR="file://$RUNNER_TEMP/mirror.git" node --input-type=module <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs';
          import semanticRelease from 'semantic-release';

          const { plugins } = JSON.parse(readFileSync('.releaserc.json', 'utf8'));
          const result = await semanticRelease({
            dryRun: true,
            ci: false,
            repositoryUrl: process.env.RELEASE_MIRROR,
            plugins: plugins.filter(
              (p) => [p].flat()[0] === '@semantic-release/commit-analyzer',
            ),
          });
          const version = result ? result.nextRelease.version : '';
          console.log(`verdict: ${version ? `release ${version}` : 'no release'}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `release=${Boolean(version)}\n`);
          EOF

  release:
    name: Release
    needs: pending
    # Pushes release only when the dry run found a next version; manual runs
    # (where the gate is skipped) always go ahead.
    if: >-
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && needs.pending.result == 'skipped') ||
        (needs.pending.result == 'success' && needs.pending.outputs.release == 'true')
      )
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run checks
        run: npm run check

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
